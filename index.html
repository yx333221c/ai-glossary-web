<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 术语大全 | AI Glossary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 AI 术语词典</h1>
            <p class="subtitle">人工智能领域的核心概念与专业术语</p>
        </header>

        <nav class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索 AI 术语...输入关键词查找相关概念">
                <span class="search-icon">🔍</span>
            </div>
            <div id="searchResults" class="results-container"></div>
        </nav>

        <main class="glossary-grid" id="glossaryGrid">
            <!-- Terms will be populated here -->
        </main>

        <footer>
            <p>AI Glossary &copy; 2024 | 涵盖机器学习、深度学习、自然语言处理等核心概念</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
